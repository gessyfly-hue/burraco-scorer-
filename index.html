<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B3B2E">
<title>Burraco – Segnapunti</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  input:focus { outline: 2px solid #C6A15B; }
  button { border: none; cursor: pointer; font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const COLORS = {
  felt: '#0B3B2E', feltDark: '#082A21', cream: '#F6F1E4', creamDark: '#E4D9BE',
  ink: '#2A2420', gold: '#C6A15B', teamA: '#A32638', teamB: '#22344A',
};
const SERIF = "Georgia, 'Iowan Old Style', 'Times New Roman', serif";
const DEFAULTS = { teamAName: 'Squadra Rossa', teamBName: 'Squadra Nera', target: 2000 };
const STORAGE_KEY = 'burraco-game-v1';

function emptyEntry() { return { meld: '', simple: 0, pulito: 0, reale: 0, wentOut: false, adj: '' }; }
function entryTotal(e) {
  const meld = parseInt(e.meld, 10) || 0;
  const adj = parseInt(e.adj, 10) || 0;
  return meld + e.simple * 100 + e.pulito * 200 + e.reale * 300 + (e.wentOut ? 100 : 0) + adj;
}
function formatDetail(e) {
  const parts = [];
  const meld = parseInt(e.meld, 10) || 0;
  if (meld) parts.push(`Calate ${meld}`);
  if (e.simple) parts.push(`Burraco ×${e.simple}`);
  if (e.pulito) parts.push(`Pulito ×${e.pulito}`);
  if (e.reale) parts.push(`Reale ×${e.reale}`);
  if (e.wentOut) parts.push('Uscita');
  const adj = parseInt(e.adj, 10) || 0;
  if (adj) parts.push(`${adj > 0 ? '+' : ''}${adj}`);
  return parts.length ? parts.join(' · ') : 'Nessun punto';
}

function Stepper({ label, points, value, onChange, accent }) {
  return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'6px 0'}}>
      <div>
        <div style={{fontFamily:SERIF,color:COLORS.ink,fontSize:14}}>{label}</div>
        <div style={{color:COLORS.ink,opacity:0.5,fontSize:12}}>{points} pt</div>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:12}}>
        <button onClick={() => onChange(Math.max(0, value - 1))}
          style={{width:32,height:32,borderRadius:'50%',background:COLORS.creamDark,color:COLORS.ink,fontSize:18,lineHeight:'32px'}}>–</button>
        <span style={{fontFamily:SERIF,color:COLORS.ink,minWidth:16,textAlign:'center',fontSize:16}}>{value}</span>
        <button onClick={() => onChange(value + 1)}
          style={{width:32,height:32,borderRadius:'50%',background:accent,color:COLORS.cream,fontSize:18,lineHeight:'32px'}}>+</button>
      </div>
    </div>
  );
}

function TeamForm({ name, entry, setEntry, accent }) {
  const update = (key, val) => setEntry((e) => ({ ...e, [key]: val }));
  const inputStyle = {width:'100%',marginTop:4,marginBottom:8,padding:'8px 12px',borderRadius:8,fontSize:16,background:'#fff',color:COLORS.ink,border:`1px solid ${COLORS.creamDark}`};
  const labelStyle = {color:COLORS.ink,opacity:0.7,fontSize:12,textTransform:'uppercase',letterSpacing:0.5};
  return (
    <div>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
        <span style={{width:10,height:10,borderRadius:'50%',background:accent,display:'inline-block'}}></span>
        <h3 style={{fontFamily:SERIF,color:COLORS.ink,fontSize:16,fontWeight:600,margin:0}}>{name}</h3>
      </div>
      <label style={labelStyle}>Punti dalle calate</label>
      <input type="number" inputMode="numeric" min="0" value={entry.meld}
        onChange={(ev) => update('meld', ev.target.value)} placeholder="0" style={inputStyle} />
      <Stepper label="Burraco" points={100} value={entry.simple} onChange={(v) => update('simple', v)} accent={accent} />
      <Stepper label="Burraco pulito" points={200} value={entry.pulito} onChange={(v) => update('pulito', v)} accent={accent} />
      <Stepper label="Burraco reale" points={300} value={entry.reale} onChange={(v) => update('reale', v)} accent={accent} />
      <button onClick={() => update('wentOut', !entry.wentOut)}
        style={{width:'100%',marginTop:8,marginBottom:8,padding:'8px 0',borderRadius:8,fontSize:14,
          background: entry.wentOut ? accent : '#fff', color: entry.wentOut ? COLORS.cream : COLORS.ink,
          border:`1px solid ${entry.wentOut ? accent : COLORS.creamDark}`}}>
        {entry.wentOut ? '✓ ' : ''}Uscita (+100)
      </button>
      <label style={labelStyle}>Altri punti (malus carte, penalità)</label>
      <input type="number" inputMode="numeric" value={entry.adj}
        onChange={(ev) => update('adj', ev.target.value)} placeholder="es. -35" style={{...inputStyle, marginBottom:0}} />
      <div style={{marginTop:12,textAlign:'right',fontFamily:SERIF,color:accent}}>
        Totale mano: <span style={{fontSize:18,fontWeight:'bold'}}>{entryTotal(entry)}</span>
      </div>
    </div>
  );
}

function ScoreCard({ name, score, accent, leading, editing, onStartEdit, onNameChange, suit }) {
  return (
    <div style={{borderRadius:16,padding:16,background:COLORS.cream,
      boxShadow: leading ? `0 0 0 2px ${COLORS.gold}` : '0 4px 10px rgba(0,0,0,0.25)'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
        <span style={{color:accent,fontFamily:SERIF,fontSize:18}}>{suit}</span>
        {leading && <span style={{color:COLORS.gold,fontSize:16}}>🏆</span>}
      </div>
      <div style={{fontFamily:SERIF,color:COLORS.ink,fontSize:30,fontWeight:'bold',lineHeight:1}}>{score}</div>
      {editing ? (
        <input autoFocus defaultValue={name}
          onBlur={(ev) => onNameChange(ev.target.value.trim() || name)}
          onKeyDown={(ev) => { if (ev.key === 'Enter') ev.target.blur(); }}
          style={{width:'100%',marginTop:8,padding:'4px 8px',borderRadius:6,fontSize:14,border:`1px solid ${COLORS.creamDark}`,color:COLORS.ink}} />
      ) : (
        <button onClick={onStartEdit} style={{color:COLORS.ink,opacity:0.75,fontSize:14,marginTop:8,background:'none',textAlign:'left',width:'100%',padding:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
          {name}
        </button>
      )}
    </div>
  );
}

function BurracoScorer() {
  const [loaded, setLoaded] = useState(false);
  const [teamAName, setTeamAName] = useState(DEFAULTS.teamAName);
  const [teamBName, setTeamBName] = useState(DEFAULTS.teamBName);
  const [target, setTarget] = useState(DEFAULTS.target);
  const [rounds, setRounds] = useState([]);
  const [editingName, setEditingName] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  const [showForm, setShowForm] = useState(false);
  const [entryA, setEntryA] = useState(emptyEntry());
  const [entryB, setEntryB] = useState(emptyEntry());
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [confirmNewGame, setConfirmNewGame] = useState(false);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        setTeamAName(data.teamAName ?? DEFAULTS.teamAName);
        setTeamBName(data.teamBName ?? DEFAULTS.teamBName);
        setTarget(data.target ?? DEFAULTS.target);
        setRounds(Array.isArray(data.rounds) ? data.rounds : []);
      }
    } catch (err) {}
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ teamAName, teamBName, target, rounds }));
    } catch (err) {}
  }, [loaded, teamAName, teamBName, target, rounds]);

  let ra = 0, rb = 0;
  const withCum = rounds.map((r) => { ra += r.a; rb += r.b; return { ...r, cumA: ra, cumB: rb }; });
  const cumA = ra, cumB = rb;
  const displayRounds = [...withCum].reverse();
  const winnerName = cumA >= target || cumB >= target ? (cumA >= cumB ? teamAName : teamBName) : null;

  function addRound() {
    setRounds((r) => [...r, { id: Date.now(), a: entryTotal(entryA), b: entryTotal(entryB), detailA: entryA, detailB: entryB }]);
    setEntryA(emptyEntry());
    setEntryB(emptyEntry());
    setShowForm(false);
  }
  function deleteRound(id) {
    if (confirmDelete === id) {
      setRounds((r) => r.filter((x) => x.id !== id));
      setConfirmDelete(null);
    } else {
      setConfirmDelete(id);
      setTimeout(() => setConfirmDelete((c) => (c === id ? null : c)), 3000);
    }
  }
  function newGame() { setRounds([]); setConfirmNewGame(false); setShowSettings(false); }

  if (!loaded) {
    return <div style={{background:COLORS.felt,minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{color:COLORS.gold,fontFamily:SERIF,fontSize:18}}>Carico la partita…</div>
    </div>;
  }

  return (
    <div style={{background:`linear-gradient(180deg, ${COLORS.feltDark}, ${COLORS.felt})`,minHeight:'100vh'}}>
      <div style={{maxWidth:448,margin:'0 auto',padding:'24px 16px 64px'}}>
        <header style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:20}}>
          <div>
            <h1 style={{fontFamily:SERIF,color:COLORS.gold,fontSize:30,lineHeight:1,margin:0}}>Burraco</h1>
            <p style={{color:COLORS.cream,opacity:0.6,fontSize:12,textTransform:'uppercase',letterSpacing:1,marginTop:4}}>Segnapunti · obiettivo {target}</p>
          </div>
          <button onClick={() => setShowSettings((s) => !s)}
            style={{width:36,height:36,borderRadius:'50%',background:'rgba(255,255,255,0.08)',color:COLORS.cream,fontSize:16}}>⚙</button>
        </header>

        {showSettings && (
          <div style={{borderRadius:16,padding:16,marginBottom:20,background:COLORS.cream}}>
            <label style={{color:COLORS.ink,opacity:0.7,fontSize:12,textTransform:'uppercase'}}>Punteggio obiettivo</label>
            <input type="number" inputMode="numeric" value={target}
              onChange={(ev) => setTarget(parseInt(ev.target.value, 10) || 0)}
              style={{width:'100%',marginTop:4,marginBottom:12,padding:'8px 12px',borderRadius:8,fontSize:16,background:'#fff',color:COLORS.ink,border:`1px solid ${COLORS.creamDark}`}} />
            {confirmNewGame ? (
              <div style={{display:'flex',gap:8}}>
                <button onClick={newGame} style={{flex:1,padding:'8px 0',borderRadius:8,fontSize:14,background:COLORS.teamA,color:'#fff'}}>Conferma reset</button>
                <button onClick={() => setConfirmNewGame(false)} style={{flex:1,padding:'8px 0',borderRadius:8,fontSize:14,background:COLORS.creamDark,color:COLORS.ink}}>Annulla</button>
              </div>
            ) : (
              <button onClick={() => setConfirmNewGame(true)} style={{width:'100%',padding:'8px 0',borderRadius:8,fontSize:14,background:COLORS.creamDark,color:COLORS.ink}}>
                ↺ Nuova partita (azzera storico)
              </button>
            )}
          </div>
        )}

        {winnerName && (
          <div style={{borderRadius:16,padding:16,marginBottom:20,textAlign:'center',background:COLORS.gold}}>
            <div style={{fontSize:20}}>🏆</div>
            <div style={{fontFamily:SERIF,color:COLORS.feltDark,fontSize:18,fontWeight:'bold',marginTop:4}}>
              {winnerName} ha raggiunto {target} punti!
            </div>
          </div>
        )}

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:20}}>
          <ScoreCard name={teamAName} score={cumA} accent={COLORS.teamA} leading={cumA > cumB} suit="♥"
            editing={editingName === 'a'} onStartEdit={() => setEditingName('a')}
            onNameChange={(v) => { setTeamAName(v); setEditingName(null); }} />
          <ScoreCard name={teamBName} score={cumB} accent={COLORS.teamB} leading={cumB > cumA} suit="♠"
            editing={editingName === 'b'} onStartEdit={() => setEditingName('b')}
            onNameChange={(v) => { setTeamBName(v); setEditingName(null); }} />
        </div>

        <button onClick={() => setShowForm((s) => !s)}
          style={{width:'100%',padding:'12px 0',borderRadius:12,fontSize:14,fontWeight:600,
            background: showForm ? COLORS.creamDark : COLORS.gold, color: COLORS.feltDark}}>
          {showForm ? '✕ Chiudi' : '+ Aggiungi mano'}
        </button>

        {showForm && (
          <div style={{marginTop:16,borderRadius:16,padding:16,background:COLORS.cream}}>
            <TeamForm name={teamAName} entry={entryA} setEntry={setEntryA} accent={COLORS.teamA} />
            <div style={{height:1,margin:'16px 0',background:COLORS.creamDark}}></div>
            <TeamForm name={teamBName} entry={entryB} setEntry={setEntryB} accent={COLORS.teamB} />
            <button onClick={addRound} style={{width:'100%',marginTop:16,padding:'12px 0',borderRadius:12,fontSize:14,fontWeight:600,background:COLORS.felt,color:COLORS.cream}}>
              Salva mano
            </button>
          </div>
        )}

        <section style={{marginTop:32}}>
          <h2 style={{fontFamily:SERIF,color:COLORS.gold,fontSize:16,marginBottom:12}}>Storico mani</h2>
          {displayRounds.length === 0 ? (
            <p style={{color:COLORS.cream,opacity:0.5,fontSize:14}}>Nessuna mano registrata. Aggiungi la prima mano per iniziare a segnare i punti.</p>
          ) : (
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {displayRounds.map((r, i) => (
                <div key={r.id} style={{borderRadius:12,padding:12,background:'rgba(246,241,228,0.08)'}}>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
                    <span style={{color:COLORS.gold,fontFamily:SERIF,fontSize:12,textTransform:'uppercase',letterSpacing:0.5}}>Mano {displayRounds.length - i}</span>
                    <button onClick={() => deleteRound(r.id)}
                      style={{width:28,height:28,borderRadius:'50%',background: confirmDelete === r.id ? COLORS.teamA : 'rgba(255,255,255,0.08)',color:COLORS.cream,fontSize:13}}>
                      {confirmDelete === r.id ? '✓' : '🗑'}
                    </button>
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                    <div>
                      <div style={{color:COLORS.cream,fontSize:14,fontWeight:600}}>+{r.a} <span style={{opacity:0.5,fontWeight:400}}>→ {r.cumA}</span></div>
                      <div style={{color:COLORS.cream,opacity:0.55,fontSize:12}}>{formatDetail(r.detailA)}</div>
                    </div>
                    <div>
                      <div style={{color:COLORS.cream,fontSize:14,fontWeight:600}}>+{r.b} <span style={{opacity:0.5,fontWeight:400}}>→ {r.cumB}</span></div>
                      <div style={{color:COLORS.cream,opacity:0.55,fontSize:12}}>{formatDetail(r.detailB)}</div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </section>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<BurracoScorer />);
</script>
</body>
</html>
